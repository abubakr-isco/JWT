<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</head>
<body>
  <main class="page">
    <form id="login-form" class="card" novalidate>
      <h1 class="card__title">Вход</h1>
      <p class="card__subtitle">Тестовый аккаунт: <code>emilys</code> / <code>emilyspass</code></p>

      <div class="field">
        <label class="field__label" for="username">Логин</label>
        <input class="input" id="username" name="username" type="text"
               autocomplete="username" aria-describedby="username-error">
        <p class="field__error" id="username-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label class="field__label" for="password">Пароль</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" aria-describedby="password-error">
        <p class="field__error" id="password-error" aria-live="polite"></p>
      </div>

      <p class="alert" id="form-error" role="alert" hidden></p>

      <button class="button" id="submit-button" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
